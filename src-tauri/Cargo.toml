[package]
name = "aethon"
version = "0.0.31"
description = "Aethon — Modern Lossless Music Player for Arch Linux"
authors = ["Abhinav"]
edition = "2021"

[lib]
name = "aethon_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon", "image-png"] }
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["full"] }
rusqlite = { version = "0.32", features = ["bundled"] }
lofty = "0.21"
walkdir = "2"
reqwest = { version = "0.12", features = ["json"] }
dirs = "5"
parking_lot = "0.12"

[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "abort"
strip = true
