<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e1833" />
      <stop offset="50%" stop-color="#12111d" />
      <stop offset="100%" stop-color="#09080e" />
    </linearGradient>

    <!-- Border Gradient -->
    <linearGradient id="borderGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#c084fc" stop-opacity="0.8" />
      <stop offset="50%" stop-color="#818cf8" stop-opacity="0.3" />
      <stop offset="100%" stop-color="#38bdf8" stop-opacity="0.1" />
    </linearGradient>

    <!-- Waveform Glow & Gradient -->
    <linearGradient id="waveGrad" x1="0%" y1="100%" x2="0%" y2="0%">
      <stop offset="0%" stop-color="#6366f1" />
      <stop offset="40%" stop-color="#a855f7" />
      <stop offset="80%" stop-color="#ec4899" />
      <stop offset="100%" stop-color="#f472b6" />
    </linearGradient>

    <radialGradient id="centerGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#a855f7" stop-opacity="0.35" />
      <stop offset="60%" stop-color="#6366f1" stop-opacity="0.12" />
      <stop offset="100%" stop-color="#6366f1" stop-opacity="0" />
    </radialGradient>

    <filter id="bloom" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="12" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>

    <filter id="subtleShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="16" stdDeviation="24" flood-color="#000000" flood-opacity="0.65" />
    </filter>
  </defs>

  <!-- Base Squircle with Shadow -->
  <rect x="32" y="32" width="448" height="448" rx="104" ry="104" fill="url(#bgGrad)" filter="url(#subtleShadow)" />

  <!-- Inner Ambient Glow Behind Soundwave -->
  <circle cx="256" cy="256" r="170" fill="url(#centerGlow)" />

  <!-- Soundwave Bars forming Aethon Graphic Equalizer Symbol -->
  <!-- 5 vertical pill bars, centered at 256. Bar width: 34, spacing: 56 -->
  <!-- Bar 1: x = 256 - 112 - 17 = 127. Center y=256, h=130 -> y=191 -->
  <!-- Bar 2: x = 256 - 56 - 17 = 183. Center y=256, h=220 -> y=146 -->
  <!-- Bar 3: x = 256 - 17 = 239. Center y=256, h=300 -> y=106 -->
  <!-- Bar 4: x = 256 + 56 - 17 = 295. Center y=256, h=220 -> y=146 -->
  <!-- Bar 5: x = 256 + 112 - 17 = 351. Center y=256, h=130 -> y=191 -->
  <g filter="url(#bloom)">
    <!-- Bar 1 (Outer Left) -->
    <rect x="127" y="196" width="34" height="120" rx="17" ry="17" fill="url(#waveGrad)" opacity="0.88" />

    <!-- Bar 2 (Mid Left) -->
    <rect x="183" y="146" width="34" height="220" rx="17" ry="17" fill="url(#waveGrad)" opacity="0.96" />

    <!-- Bar 3 (Center Peak) -->
    <rect x="239" y="112" width="34" height="288" rx="17" ry="17" fill="url(#waveGrad)" />

    <!-- Bar 4 (Mid Right) -->
    <rect x="295" y="146" width="34" height="220" rx="17" ry="17" fill="url(#waveGrad)" opacity="0.96" />

    <!-- Bar 5 (Outer Right) -->
    <rect x="351" y="196" width="34" height="120" rx="17" ry="17" fill="url(#waveGrad)" opacity="0.88" />
  </g>

  <!-- Stylized Precision Glass Squircle Border -->
  <rect x="33" y="33" width="446" height="446" rx="103" ry="103" fill="none" stroke="url(#borderGrad)" stroke-width="3" />
</svg>
